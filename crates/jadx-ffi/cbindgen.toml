# cbindgen configuration for `crates/jadx-ffi`.
#
# The shipped header is the hand-written `include/jadx.h`; this file exists so a
# maintainer can regenerate a *comparable* header and diff it:
#
#   cbindgen --config crates/jadx-ffi/cbindgen.toml \
#            --output /tmp/jadx_generated.h crates/jadx-ffi
#
# `crates/jadx-ffi/tests/abi.rs` is the check that runs in CI, because it needs no
# cbindgen installation.
language = "C"
include_version = true
tab_indent = true
indent_style = "Space"
documentation = true
documentation_style = "C99"
documentation_trailing_comments = false
after_includes = ""
pragma_once = false
header = """/*
 * Generated by cbindgen from crates/jadx-ffi/src/lib.rs -- see include/jadx.h for
 * the documented, hand-written header that is actually shipped.
 */"""
trailer = ""
include_guard = "JADX_H"
autogen_warning = "/* Hand-editing this file is pointless: edit src/lib.rs, or edit include/jadx.h and update the tests. */"
sys_includes = ["stddef.h", "stdint.h"]
no_includes = false
cpp_compat = true

[export]
prefix = ""
# every export already carries the `jadx_` prefix, applied by hand in src/lib.rs
item = ["jadx_ctx", "jadx_class", "jadx_ref_type", "jadx_input_kind", "jadx_log_cb", "jadx_progress_cb"]

[export.rename]
"jadx_ctx" = "jadx_ctx"
"jadx_class" = "jadx_class"

[fn]
args = "auto"
rename_args = "None"
# `jadx_ctx_new()` has no parameters; cbindgen would otherwise print `void`, which
# is what we want anyway.
sort_by = "Name"
no_return = false

[struct]
derive_eq = false
associated_constants_in_body = false

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true

[parse]
parse_deps = false
include = ["jadx-ffi"]

[parse.expand]
crates = []
