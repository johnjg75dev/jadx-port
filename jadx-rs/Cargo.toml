[workspace]
members = ["crates/jadx-rs", "crates/jadx-ffi"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/johnjg75dev/jadx-port"
rust-version = "1.70"  # std::sync::OnceLock, used by crates/jadx-ffi

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
